name: Build DXVK with Clang

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.1.1)'
        required: true
        default: 'v3.1.1'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRAFT: ${{ inputs.draft || 'false' }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'
  LLVM_MINGW_VERSION: '20260922'
  MESON_COMMON_ARGS: '--buildtype release'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - ver: v3
            flags: -march=x86-64-v3 -mtune=znver3 ${{ vars.FLAGS }}
          - ver: v4
            flags: -march=x86-64-v4 -mtune=znver4 ${{ vars.FLAGS }}
    runs-on: self-hosted
    timeout-minutes: 60
    container:
      image: archlinux/archlinux:multilib-devel
    env:
      OPT_FLAGS: ${{ matrix.flags }}
      CCACHE_DIR: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/.ccache-${{ matrix.ver }}
    steps:
      - name: Compute version variables
        run: |
          DXVK_VERSION="${TAG#v}"
          echo "DXVK_VERSION=$DXVK_VERSION" >> $GITHUB_ENV
          echo "Using DXVK_VERSION=$DXVK_VERSION"

      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-dxvk-clang-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-dxvk-clang-${{ matrix.ver }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -s

      - name: Install dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            git meson ninja \
            clang llvm lld \
            glslang python wine \
            ccache curl xz

          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL "$LLVM_MINGW_URL" -o /tmp/llvm-mingw.tar.xz
          mkdir -p /opt/llvm-mingw
          tar -xJf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          rm /tmp/llvm-mingw.tar.xz

          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

          echo "--- llvm-mingw x86_64 clang ---"
          /opt/llvm-mingw/bin/x86_64-w64-mingw32-clang --version | head -3
          echo "--- llvm-mingw i686 clang ---"
          /opt/llvm-mingw/bin/i686-w64-mingw32-clang --version | head -3
          echo "--- lld-link ---"
          /opt/llvm-mingw/bin/lld-link --version | head -3

      - name: Clone DXVK source
        run: |
          rm -rf dxvk
          git clone --depth 1 --branch "${TAG}" \
            https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git submodule update --init --recursive

      - name: Copy Clang cross-files
        run: |
          cp .github/helpers/build-win64-clang-${{ matrix.ver }}.txt dxvk/build-win64-clang.txt
          cp .github/helpers/build-win32-clang-${{ matrix.ver }}.txt dxvk/build-win32-clang.txt
          ls -l dxvk/build-win*-clang.txt

      - name: Patch DXVK for Clang AVX support
        working-directory: dxvk
        run: |
          # Remove AVX check, which blocks Clang build
          sed -i '/#error "AVX-enabled builds not supported due to stack alignment issues."/d' src/util/util_bit.h

          # Check that patch is applied
          if grep -q "AVX-enabled builds not supported" src/util/util_bit.h; then
            echo "ERROR: Patch failed to apply"
            exit 1
          fi
          echo "AVX check removed successfully"

          # Show context near changes
          grep -n -B 2 -A 2 "DXVK_ARCH_X86" src/util/util_bit.h | head -20

      - name: Patch DXVK for Clang 22 tuple compatibility
        working-directory: dxvk
        run: |
          # Fix for issue #5545: Clang 22 stricter parameter pack validation
          find src -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec sed -i 's/std::tuple()/std::tuple<>()/g' {} +

          # Verify: no std::tuple() left
          if grep -rn "std::tuple()" src/; then
            echo "WARNING: some std::tuple() remain (check if critical)"
          else
            echo "All std::tuple() replaced"
          fi

      - name: Build DXVK
        working-directory: dxvk
        id: build
        run: |
          meson setup build.64-clang --cross-file=build-win64-clang.txt $MESON_COMMON_ARGS
          ninja -C build.64-clang

          meson setup build.32-clang --cross-file=build-win32-clang.txt $MESON_COMMON_ARGS
          ninja -C build.32-clang

          mkdir -p "dxvk-${DXVK_VERSION}/x64" "dxvk-${DXVK_VERSION}/x86"

          find build.64-clang -name '*.dll' -exec cp {} "dxvk-${DXVK_VERSION}/x64/" \;
          find build.32-clang -name '*.dll' -exec cp {} "dxvk-${DXVK_VERSION}/x86/" \;

          [ -f setup_dxvk.sh ] && cp setup_dxvk.sh "dxvk-${DXVK_VERSION}/" || true

          tar -caf "dxvk-${DXVK_VERSION}-x86-64-${{ matrix.ver }}.tar.zst" "dxvk-${DXVK_VERSION}"
          echo "Archive created:"
          ls -lh "dxvk-${DXVK_VERSION}-x86-64-${{ matrix.ver }}.tar.zst"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dxvk-archive-${{ matrix.ver }}
          path: dxvk/dxvk-*.tar.zst
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: ccache -s

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DXVK_VERSION="${TAG#v}"
          FLAGS=(--latest)
          [[ $DRAFT = true ]] && FLAGS=(--draft)

          TITLE="DXVK ${DXVK_VERSION} (Clang x86-64-v3/v4)"
          [[ $DRAFT = true ]] && TITLE="[DRAFT] $TITLE"

          ls -lh artifacts/

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*.tar.zst
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target ${{ github.sha }} \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              "${FLAGS[@]}" \
              artifacts/*.tar.zst
          fi
